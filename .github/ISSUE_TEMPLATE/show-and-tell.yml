name: 📺 이렇게 쓰고 있어요
description: 방송에 올린 화면을 자랑해 주세요 (개발자가 제일 좋아하는 이슈입니다)
title: "[사용] "
labels: ["사용자랑"]
body:
  - type: markdown
    attributes:
      value: |
        온에어킷은 서버가 없어서 **몇 명이 쓰고 있는지 알 방법이 전혀 없습니다.**
        그래서 이 이슈 하나하나가 계속 만들 이유가 됩니다. 스크린샷 한 장이면 충분합니다.

  - type: textarea
    id: screenshot
    attributes:
      label: 방송 화면 스크린샷
      description: 이 칸에 이미지를 그대로 끌어다 놓으시면 첨부됩니다. 게임 화면 위에 올라간 모습이면 제일 좋습니다.
    validations:
      required: true

  - type: checkboxes
    id: widgets
    attributes:
      label: 어떤 위젯을 쓰고 계신가요?
      options:
        - label: 텔롭 (자막)
        - label: 타이머 / 카운트다운
        - label: 카운터 (데스카운트 등)
        - label: 시참 대기열
        - label: 룰렛

  - type: textarea
    id: how
    attributes:
      label: 어떻게 쓰고 계신가요?
      placeholder: 방송 시작 전 대기 화면에 타이머 띄우고, 게임 중에는 데스카운트를 오른쪽 위에 둡니다.

  - type: input
    id: channel
    attributes:
      label: 방송 채널 (선택)
      description: |
        알려주시면 어떻게 쓰고 계신지 보러 가겠습니다.
        괜찮으시면 랜딩 페이지에 "이런 분들이 쓰고 있어요"로 소개해도 될지 아래에 체크해 주세요.
      placeholder: https://chzzk.naver.com/...

  - type: checkboxes
    id: permission
    attributes:
      label: 소개 동의 (선택)
      options:
        - label: 온에어킷 소개 페이지에 내 채널명과 스크린샷을 써도 좋습니다
        - label: 스크린샷만 써도 좋습니다 (채널명은 빼 주세요)

  - type: textarea
    id: wish
    attributes:
      label: 쓰면서 아쉬웠던 점이 있다면?
      description: 버그가 아니라 사소한 불편이어도 좋습니다. 이런 게 다음 버전에 반영됩니다.
