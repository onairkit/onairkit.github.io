<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온에어킷 · 룰렛</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
   온에어킷(onairkit) — 룰렛 위젯 (roulette.html)
   벌칙·메뉴·시청자 참여 뽑기용 원판 룰렛. 돌리면 위쪽 고정 포인터가
   가리킨 조각이 당첨되고, 원판 아래에 결과가 크게 뜹니다.
  ═══════════════════════════════════════════════════════════════════════

  ■ OBS에서 쓰는 법
    1) OBS 소스 목록에서 [+] → "브라우저" 선택
    2) "로컬 파일" 체크 → 이 파일(roulette.html) 선택
    3) 폭 1920 / 높이 1080 입력 → 확인
    4) 화면에서 크기·위치를 자유롭게 조절

  ■ 파라미터로 바꾸는 법
    OBS에서 "로컬 파일" 체크를 해제하고, URL 칸에 아래 형식으로 입력합니다.
      file:///C:/경로/roulette.html?파라미터=값&파라미터=값
    예)
      file:///C:/Users/내이름/Desktop/onairkit/widgets/roulette.html?items=치킨|피자|족발

  ■ OBS에서 조작하는 법  (매우 중요)
    OBS 방송 화면에는 마우스 커서가 없습니다. 조작은 소스 우클릭 →
    "상호작용(Interact)" 창에서만 가능합니다.
    그래서 이 위젯의 [돌리기]·[리셋] 버튼은 평소에는 완전히 투명하게
    숨겨져 있고(opacity:0 / pointer-events:none), 마우스를 위젯 위에
    올렸을 때(hover)만 나타납니다(opacity:1 / pointer-events:auto).
    → 방송 송출 화면에는 버튼이 절대 보이지 않고,
      "상호작용" 창에서 마우스를 올릴 때만 원판 한가운데에 나타납니다.

    조작 방법
      · 원판을 클릭      → 돌리기
      · [돌리기] 버튼    → 돌리기 (원판 가운데, hover 시 표시)
      · [리셋] 버튼      → 항목 전체 복구
      · 키보드 Space     → 돌리기   (상호작용 창에 포커스가 있을 때)
      · 키보드 R         → 리셋
      · 회전 중에는 모든 입력을 무시합니다.

    남은 항목 상태는 브라우저 localStorage("onairkit:roulette:items")에
    저장되므로 새로고침하거나 OBS를 재시작해도 유지됩니다.
    처음 상태로 되돌리려면 URL 끝에 ?reset=1 을 붙이거나 R 키를 누르세요.

  ■ 파라미터 표
    ┌──────────┬────────────────────────────────────────┬────────────┬──────────────────────────────┐
    │ 이름     │ 설명                                   │ 기본값     │ 허용 범위                    │
    ├──────────┼────────────────────────────────────────┼────────────┼──────────────────────────────┤
    │ items    │ 룰렛 항목. | 로 구분                   │ 치킨|피자|…│ 2~12개 (넘으면 앞 12개만)    │
    │ title    │ 원판 위 제목. 빈 값이면 숨김           │ 돌려돌려 룰렛│ 문자열 (60자까지)          │
    │ duration │ 회전 시간(초)                          │ 5          │ 2 ~ 15                       │
    │ remove   │ 1=당첨 항목 제거(중복 없는 뽑기)       │ 0          │ 1 / 0                        │
    │ result   │ 1=원판 아래 당첨 결과 크게 표시        │ 1          │ 1 / 0                        │
    │ diameter │ 원판 지름(px)                          │ 420        │ 200 ~ 900                    │
    │ reset    │ 1이면 저장된 상태를 무시하고 초기화    │ (없음)     │ 1                            │
    ├──────────┴────────────────────────────────────────┴────────────┴──────────────────────────────┤
    │ 공통 파라미터 (온에어킷 모든 위젯 공통)                                                        │
    ├──────────┬────────────────────────────────────────┬────────────┬──────────────────────────────┤
    │ size     │ 항목 글자 크기(px)                     │ 26         │ 16 ~ 120                     │
    │ accent   │ 포인트 색 hex (# 생략 가능)            │ theme 기본 │ 3자리/6자리 hex              │
    │ dark     │ 1=다크 / 0=라이트                      │ theme 기본 │ 1 / 0                        │
    │ theme    │ 색 프리셋                              │ default    │ default|news|pastel|minimal  │
    │ pos      │ 위젯 위치                              │ c          │ bl|br|tl|tr|tc|bc|c          │
    │ margin   │ 화면 가장자리 여백(px)                 │ 48         │ 0 ~ 400                      │
    │ credit   │ 1=표시 / 0=숨김 / 문자열=문구 교체     │ 1          │ 1 / 0 / 임의 문자열          │
    └──────────┴────────────────────────────────────────┴────────────┴──────────────────────────────┘
    · 값이 이상하거나 범위를 벗어나면 자동으로 기본값·최소·최대값으로 보정됩니다.
    · theme 이 dark·accent 의 기본값을 정합니다. dark 나 accent 를 직접 쓰면 그쪽이 우선입니다.

  ■ 예시 URL (그대로 복사해서 써도 동작합니다)
    1) 저녁 메뉴 뽑기
       roulette.html?items=치킨|피자|족발|마라탕|초밥|제육덮밥&title=오늘 저녁 뭐 먹지
    2) 벌칙 룰렛 (뉴스 속보 스타일, 크게)
       roulette.html?items=목소리 3톤 업|10분 무발언|구독자 성대모사|팔굽혀펴기 20개&title=벌칙 룰렛&theme=news&diameter=560&duration=8
    3) 시청자 참여 추첨 (중복 없이 뽑기, 라이트 파스텔)
       roulette.html?items=꼬미|초코칩|랜선여친|왕감자|밤톨이|다람쥐|고양이집사|피클&title=시참 추첨&remove=1&theme=pastel&pos=bc&size=20
    4) 결과 문구 없이 원판만, 우하단 작게
       roulette.html?items=예|아니오&title=&result=0&diameter=240&pos=br&margin=40&accent=ffd166
    5) 미니멀 라이트 + 크레딧 문구 교체
       roulette.html?theme=minimal&credit=내채널이름&duration=3
  ═══════════════════════════════════════════════════════════════════════
-->
<!--
  Pretendard / SIL Open Font License 1.1
  (c) 2021 Kil Hyung-jin, with Reserved Font Name 'Pretendard'
  https://github.com/orioncactus/pretendard/blob/main/LICENSE
  온에어킷은 Pretendard를 수정 없이 원본 그대로 CDN으로 불러옵니다.

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *{box-sizing:border-box}
  :root{
    --acc:#00ffa3;                 /* 포인트 색 */
    --accink:#0e1116;              /* 액센트 배경 위 글자색(밝기에 따라 JS가 결정) */
    --panel:rgba(18,19,24,.92);    /* 패널(제목·결과·버튼) 배경 */
    --ink:#f4f6f8;                 /* 패널 글자색 */
    --inkdim:rgba(244,246,248,.62);
    --rad:14px;                    /* 모서리 라운드 */
    --shadow:0 12px 30px rgba(0,0,0,.40);
    --rim:#12141a;                 /* 원판 테두리 색 */
    --d:420px;                     /* 원판 지름 */
    --lfs:26px;                    /* 항목 글자 크기 */
    --tfs:22px;                    /* 제목 글자 크기 */
    --rfs:42px;                    /* 결과 글자 크기 */
    --m:48px;                      /* 화면 여백 */
    --scale:1;
  }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  body.light{--ink:#15171c;--inkdim:rgba(21,23,28,.58);--rim:#ffffff}

  /* ── 크레딧 (온에어킷 공통 코드) ───────────────────────────────── */
  #wrap{position:relative}
  #credit{position:absolute;right:2px;bottom:-17px;font-size:11px;font-weight:600;
    letter-spacing:.06em;color:rgba(255,255,255,.34);
    text-shadow:0 1px 3px rgba(0,0,0,.55);pointer-events:none;user-select:none;white-space:nowrap}
  body.light #credit{color:rgba(0,0,0,.30);text-shadow:none}
  body.nocredit #credit{display:none}
  /* pos가 상단이면 크레딧을 아래로 뒤집어 화면 밖 잘림 방지 */
  body.postop #credit{bottom:auto;top:calc(100% + 4px)}

  /* ── 배치 ─────────────────────────────────────────────────────── */
  /* width를 반드시 고정한다. 지정하지 않으면 position:fixed + left:50% 인
     pos-c/tc/bc 에서 폭이 shrink-to-fit(가용폭 50vw)으로 눌려,
     창이 원판 지름의 2배보다 좁을 때 translateX(-50%) 중앙정렬이 어긋난다. */
  #wrap{position:fixed;width:var(--d);transform:scale(var(--scale))}
  #wrap.pos-bl{left:var(--m);bottom:var(--m);transform-origin:left bottom}
  #wrap.pos-br{right:var(--m);bottom:var(--m);transform-origin:right bottom}
  #wrap.pos-tl{left:var(--m);top:var(--m);transform-origin:left top}
  #wrap.pos-tr{right:var(--m);top:var(--m);transform-origin:right top}
  #wrap.pos-tc{left:50%;top:var(--m);transform:translateX(-50%) scale(var(--scale));transform-origin:center top}
  #wrap.pos-bc{left:50%;bottom:var(--m);transform:translateX(-50%) scale(var(--scale));transform-origin:center bottom}
  #wrap.pos-c {left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center center}

  #inner{width:var(--d);display:flex;flex-direction:column;align-items:center;
    animation:enter .62s cubic-bezier(.2,.8,.2,1) both}
  @keyframes enter{from{transform:translateY(22px);opacity:0}}

  /* ── 제목 칩 ──────────────────────────────────────────────────── */
  #title{max-width:100%;margin-bottom:14px;padding:9px 20px;
    background:var(--panel);color:var(--ink);border-radius:var(--rad);
    font-size:var(--tfs);font-weight:800;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-shadow:var(--shadow);border-top:2px solid var(--acc)}
  #title.off{display:none}
  body.theme-news #title{border-top:0;border-left:5px solid var(--acc)}

  /* ── 원판 ─────────────────────────────────────────────────────── */
  #stage{position:relative;width:var(--d);height:var(--d);cursor:pointer}
  #wheel{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    transform:rotate(0deg);will-change:transform;
    background:#333;
    box-shadow:0 0 0 7px var(--rim),0 0 0 9px rgba(0,0,0,.28),
      0 18px 42px rgba(0,0,0,.45),inset 0 0 46px rgba(0,0,0,.30)}
  #spokes{position:absolute;inset:0;border-radius:50%;pointer-events:none}
  #hi{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    opacity:0;transition:opacity .3s ease;mix-blend-mode:screen}
  #hi.on{opacity:1;animation:hipulse 1.4s ease-in-out 3}
  body.light #hi{mix-blend-mode:normal}
  @keyframes hipulse{0%,100%{opacity:.34}50%{opacity:1}}

  #labels{position:absolute;inset:0}
  .lab{position:absolute;left:50%;top:50%;width:50%;
    height:calc(var(--lfs) * 1.3);margin-top:calc(var(--lfs) * -0.65);
    transform-origin:0 50%;display:flex;align-items:center;pointer-events:none}
  .lab > span{display:block;width:100%;text-align:right;padding:0 6% 0 33%;
    font-size:var(--lfs);font-weight:800;line-height:1.3;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 3px rgba(0,0,0,.45)}
  .lab.flip > span{text-align:left;padding:0 33% 0 6%;transform:rotate(180deg)}
  .lab.inkdark > span{text-shadow:0 1px 2px rgba(255,255,255,.45)}

  /* 가운데 허브 (회전하지 않음) */
  #hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:calc(var(--d) * .25);height:calc(var(--d) * .25);border-radius:50%;
    background:var(--panel);color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 0 0 4px var(--rim),0 6px 18px rgba(0,0,0,.42);
    pointer-events:none;user-select:none}
  #hubn{font-size:calc(var(--d) * .085);font-weight:900;line-height:1;color:var(--acc)}
  #hubl{font-size:calc(var(--d) * .032);font-weight:700;line-height:1;margin-top:.35em;
    letter-spacing:.08em;color:var(--inkdim)}

  /* 상단 고정 포인터 */
  #ptr{position:absolute;left:50%;top:calc(var(--d) * -.055);
    width:calc(var(--d) * .1);height:calc(var(--d) * .135);
    transform:translateX(-50%);z-index:5;pointer-events:none;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
  /* 어떤 조각 색 위에 놓여도 보이도록 바깥 케이스 + 안쪽 액센트 2겹 */
  #ptr .pcase{fill:var(--rim);stroke:rgba(0,0,0,.4);stroke-width:1.6}
  #ptr .pin{fill:var(--acc)}
  #ptr.hit{animation:ptrhit .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes ptrhit{
    0%{transform:translateX(-50%) scale(1)}
    35%{transform:translateX(-50%) scale(1.22) translateY(-4%)}
    100%{transform:translateX(-50%) scale(1)}}

  /* ── 결과 ─────────────────────────────────────────────────────── */
  #result{margin-top:16px;width:100%;padding:12px 22px 14px;
    background:var(--panel);color:var(--ink);border-radius:var(--rad);
    box-shadow:var(--shadow);text-align:center;
    opacity:0;transform:translateY(12px) scale(.94);pointer-events:none}
  #result.off{display:none}
  #result.show{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes pop{
    0%{opacity:0;transform:translateY(14px) scale(.9)}
    60%{opacity:1;transform:translateY(0) scale(1.04)}
    100%{opacity:1;transform:translateY(0) scale(1)}}
  body.theme-news #result{border-left:5px solid var(--acc)}
  #reslabel{font-size:calc(var(--rfs) * .34);font-weight:800;letter-spacing:.22em;
    color:var(--acc);margin-bottom:2px}
  /* min-height로 빈 상태에서도 결과 줄 높이를 미리 확보 → 첫 당첨 때 위젯이 밀리지 않음 */
  #reswin{font-size:var(--rfs);font-weight:900;letter-spacing:-.02em;line-height:1.2;
    min-height:calc(var(--rfs) * 1.2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 마지막 하나 안내 */
  #notice{display:none;margin-top:12px;max-width:100%;padding:8px 16px;
    background:var(--panel);color:var(--ink);border-radius:var(--rad);
    box-shadow:var(--shadow);font-size:calc(var(--tfs) * .82);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-top:2px solid var(--acc)}
  #notice.on{display:block}

  /* ── 조작 UI: 평소 숨김, hover 시에만 표시 (OBS 상호작용 창 전용) ──
     OBS 송출 화면에는 마우스가 없으므로 버튼이 보이지 않고,
     소스 우클릭 → "상호작용" 창에서 마우스를 올렸을 때만 나타난다. */
  #ctrl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:6;display:flex;gap:8px;padding:8px;
    border-radius:calc(var(--rad) + 8px);background:rgba(8,9,12,.62);
    opacity:0;pointer-events:none;transition:opacity .18s ease}
  body.light #ctrl{background:rgba(255,255,255,.62)}
  #wrap:hover #ctrl{opacity:1;pointer-events:auto}
  #ctrl button{font-family:inherit;cursor:pointer;border:0;white-space:nowrap;
    padding:10px 20px;border-radius:var(--rad);
    font-size:calc(var(--tfs) * .78);font-weight:800;letter-spacing:-.01em;
    box-shadow:var(--shadow);transition:transform .12s ease,filter .12s ease}
  #ctrl button:hover{transform:translateY(-1px);filter:brightness(1.08)}
  #ctrl button:active{transform:translateY(1px)}
  #spin{background:var(--acc);color:var(--accink)}
  #reset{background:var(--panel);color:var(--ink)}
  #ctrl button:disabled{opacity:.38;cursor:not-allowed;transform:none;filter:none}

  @media (prefers-reduced-motion: reduce){
    #inner{animation:none}
    #hi.on{animation:none}
    #ptr.hit{animation:none}
    #result.show{animation:none;opacity:1;transform:none}
    #ctrl button{transition:none}
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="inner">
      <div id="title"></div>

      <div id="stage">
        <div id="wheel">
          <div id="spokes"></div>
          <div id="labels"></div>
          <div id="hi"></div>
        </div>
        <div id="hub"><div id="hubn"></div><div id="hubl">남음</div></div>
        <svg id="ptr" viewBox="0 0 40 48" aria-hidden="true">
          <path class="pcase" d="M20 47 L3 10 Q20 0 37 10 Z"/>
          <path class="pin" d="M20 40 L9.5 12 Q20 6 30.5 12 Z"/>
        </svg>

        <!-- 조작 버튼: 평소 투명·클릭 불가, #wrap:hover 일 때만 나타남 -->
        <div id="ctrl">
          <button id="spin" type="button">돌리기</button>
          <button id="reset" type="button">리셋</button>
        </div>
      </div>

      <div id="result">
        <div id="reslabel">당첨</div>
        <div id="reswin"></div>
      </div>

      <div id="notice"></div>
    </div>
    <div id="credit">온에어킷</div>
  </div>

<script>
/* ══════════════════════════════════════════════════════════════════
   기본 설정 — 메모장으로 열어 이 값만 고쳐도 그대로 동작합니다.
   URL 파라미터를 쓰면 아래 값을 덮어씁니다.
   accent / dark 를 "" (빈 값)으로 두면 theme 프리셋의 기본값을 씁니다.
   ══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  items:    "치킨|피자|족발|마라탕|초밥|제육덮밥",  // | 로 구분 (2~12개)
  title:    "돌려돌려 룰렛",   // 빈 값("")이면 제목 숨김
  duration: 5,                 // 회전 시간(초) 2~15
  remove:   0,                 // 1=당첨 항목 제거(중복 없는 뽑기)
  result:   1,                 // 1=원판 아래 결과 표시
  diameter: 420,               // 원판 지름(px) 200~900
  size:     26,                // 항목 글자 크기(px) 16~120
  accent:   "",                // 포인트 색 hex, ""면 theme 기본
  dark:     "",                // 1/0, ""면 theme 기본
  theme:    "default",         // default | news | pastel | minimal
  pos:      "c",               // bl|br|tl|tr|tc|bc|c

  function parseItems(src) {

      .split("|")
      .map(function (s) { return s.replace(/\s+/g, " ").trim().slice(0, 80); })
      .filter(function (s) { return s.length > 0; })

  let ALL = parseItems(P("items", CONFIG.items));
  if (ALL.length < 2) ALL = parseItems(CONFIG.items);          // CONFIG로 폴백

  /* ── 제목 ────────────────────────────────────────────────────── */
  const titleRaw = q.has("title") ? q.get("title") : (CONFIG.title == null ? "" : CONFIG.title);

  root.style.setProperty("--rad", T.rad);
  root.style.setProperty("--shadow", T.shadow);
  root.style.setProperty("--d", cfg.diameter + "px");
  root.style.setProperty("--tfs", tfs + "px");
  root.style.setProperty("--rfs", rfs + "px");
  root.style.setProperty("--m", cfg.margin + "px");

  const wrapEl = $("wrap");
  const innerEl = $("inner");
  const titleEl = $("title");
  const wheelEl = $("wheel");
  const spokesEl = $("spokes");
  const labelsEl = $("labels");
  const hiEl = $("hi");
  const hubnEl = $("hubn");
  const hublEl = $("hubl");
  const ptrEl = $("ptr");
  const resEl = $("result");
  const resWinEl = $("reswin");
  const noticeEl = $("notice");
  const spinBtn = $("spin");
  const resetBtn = $("reset");

  wrapEl.classList.add("pos-" + cfg.pos);

  /* ── 크레딧 (온에어킷 공통 코드) ─────────────────────────────── */

  /* ── 색상: accent를 기준으로 HSL 색상환 균등 분할 ────────────── */

    root.style.setProperty("--lfs", lfs.toFixed(1) + "px");

    const h = innerEl.offsetHeight || cfg.diameter;

  resetBtn.addEventListener("click", function () { resetBtn.blur(); resetAll(); });
  window.addEventListener("keydown", function (e) {
    // Ctrl+R(새로고침)·Alt/Cmd 조합까지 가로채지 않도록 조합키는 무시
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === "Space" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();          // 스크롤·버튼 중복 발동 방지
      spin();
    } else if (e.code === "KeyR" || e.key === "r" || e.key === "R") {
      e.preventDefault();
      resetAll();
    }
  });
  window.addEventListener("resize", layout);

  /* ── 시작 ────────────────────────────────────────────────────── */
  if (doReset) clearStore();
  else if (cfg.remove) {
    const st = load();
    if (st) items = st;
  }
  render();
  layout();
  if (cfg.remove && items.length <= 1) markLast(items[0] || "");

  // 웹폰트가 늦게 뜨면 크기가 달라지므로 한 번 더 계산
  if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
    document.fonts.ready.then(layout).catch(function () { /* 무시 */ });
  }
  window.addEventListener("load", layout);
})();
</script>
</body>
</html>
