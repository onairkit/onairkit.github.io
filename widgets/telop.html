<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온에어킷 · 텔롭</title>
<!--
  ─────────────────────────────────────────────────────────────
  온에어킷(onairkit) — 텔롭(자막) 위젯 v1.0
  방송 화면 아래에 예능·뉴스 스타일 자막 바를 띄웁니다.
  (여러 문구 자동 순환 / 뉴스처럼 흐르는 티커 / 4가지 테마)
  ─────────────────────────────────────────────────────────────

  ■ OBS에서 쓰는 법
    1) OBS 소스 목록에서 [+] → "브라우저" 선택
    2) "로컬 파일" 체크 → 이 파일(telop.html) 선택
    3) 폭 1920 / 높이 1080 입력 → 확인
    4) 화면에서 크기·위치를 자유롭게 조절

  ■ 파라미터로 바꾸는 법 (둘 중 편한 것)
    방법 A) 이 파일을 메모장으로 열어 <script> 맨 위 CONFIG 값만 수정
    방법 B) OBS에서 "로컬 파일" 체크를 "해제"하고, URL 칸에 아래 형식으로 입력
            file:///C:/경로/telop.html?파라미터=값&파라미터=값
            예) file:///C:/onairkit/widgets/telop.html?theme=news&label=속보&text=오늘 9시 시청자 참여전

  ■ 파라미터 표
    ┌──────────┬───────────────────────────────────────────┬───────────────┬──────────────────────────────┐
    │ 이름     │ 설명                                      │ 기본값        │ 허용 범위                    │
    ├──────────┼───────────────────────────────────────────┼───────────────┼──────────────────────────────┤
    │ text     │ 표시할 문구. |(세로줄)로 나누면 순환       │ 데모 문구     │ 아무 문자열 (개수 제한 없음) │
    │ label    │ 왼쪽 칩 문구(공지/LIVE/속보). 비우면 숨김  │ 공지          │ 아무 문자열 / 빈 값이면 숨김 │
    │ accent   │ 포인트 색 hex (# 생략 가능)               │ 테마별 기본값 │ 3자리·6자리 hex. 틀리면 무시 │
    │ mode     │ 전환 방식                                 │ slide         │ slide | fade | ticker        │
    │ interval │ 문구 전환 간격(초)                        │ 6             │ 2 ~ 60 (2초 미만 불가)       │
    │ size     │ 기준 글자 크기(px)                        │ 34            │ 16 ~ 120                     │
    │ dark     │ 어두운 바(1) / 밝은 바(0)                 │ 테마별 기본값 │ 1 | 0 (비우면 테마 기본값)   │
    │ bar      │ 자막 바 배경 표시(1) / 투명(0)            │ 1             │ 1 | 0 (0이면 글자만 떠 있음) │
    │ speed    │ ticker 흐르는 속도(px/초)                 │ 120           │ 40 ~ 400                     │
    │ theme    │ 색·모서리·그림자 프리셋                   │ default       │ default|news|pastel|minimal  │
    │ pos      │ 화면 안에서의 위치                        │ bl (좌하)     │ bl|br|tl|tr|tc|bc|c          │
    │ margin   │ 화면 가장자리 여백(px)                    │ 48            │ 0 ~ 400                      │
    │ credit   │ 오른쪽 아래 크레딧                        │ 1             │ 1 | 0(숨김) | 그 외 = 그 문구│
    │ reset    │ 저장된 상태(일시정지·현재 문구) 무시      │ (없음)        │ 1                            │
    └──────────┴───────────────────────────────────────────┴───────────────┴──────────────────────────────┘
    * bar=0 이면 어두운 막대 없이 글자만 화면에 뜹니다. 글자에 그림자가 붙어 게임 화면 위에서도 읽힙니다.
      (글자를 흰색으로 하려면 dark=1 을 함께 쓰세요. 왼쪽 칩은 유지되며, 칩도 없애려면 label= 을 비우세요)
    * theme이 dark와 accent의 기본값을 정합니다. dark나 accent를 직접 쓰면 그 값이 우선입니다.
      (news/default = 다크 기본, pastel/minimal = 라이트 기본)
    * 값을 비워 두면(예: ?size=) 그 파라미터는 없는 것으로 보고 기본값을 씁니다.
      단 label만 예외로, ?label= 처럼 비우면 "칩을 숨기라는 뜻"으로 처리합니다.
    * 숫자·목록 파라미터에 이상한 값을 넣어도 깨지지 않습니다.
      숫자는 허용 범위로 잘라내고(예: size=-999 → 16), 목록·색은 인식 못 하면 기본값을 씁니다.
    * interval은 slide·fade 모드에서만, speed는 ticker 모드에서만 쓰입니다.
    * 세로줄(|)은 문구를 나누는 기호로만 쓰입니다. 문구 안에 세로줄을 "글자로" 넣을 수는 없습니다.
      (넣으면 그 자리에서 두 문구로 잘립니다.)
    * margin을 아주 작게(0에 가깝게) 주고 아래쪽 배치(bl/br/bc)를 쓰면
      크레딧이 자막 바 아래 화면 밖으로 내려가 안 보일 수 있습니다. 여백을 20 이상 주세요.
    * mode=ticker일 때는 자막 바가 좌우 여백 사이를 꽉 채우므로
      pos의 좌우 구분(bl/br/bc 등)은 무시되고 위·아래 위치만 반영됩니다.

  ■ 예시 URL (그대로 복사해서 경로만 바꿔 쓰세요)
    1) file:///C:/onairkit/widgets/telop.html?text=시참은 !참여 입력|후원은 마음만으로 충분합니다&label=안내
    2) file:///C:/onairkit/widgets/telop.html?theme=news&label=속보&mode=ticker&speed=150&text=오늘 밤 9시 시청자 참여전|디스코드 링크는 채팅창 고정
    3) file:///C:/onairkit/widgets/telop.html?theme=pastel&pos=tc&margin=36&size=30&label=공지&text=오늘 방송은 11시에 종료합니다
    4) file:///C:/onairkit/widgets/telop.html?theme=minimal&dark=1&mode=fade&interval=8&accent=ffd166&credit=0
    5) file:///C:/onairkit/widgets/telop.html?pos=br&margin=64&label=&text=문구 하나만 조용히 띄우기

  ■ OBS에서 조작하는 법 (매우 중요)
    OBS는 방송 송출 화면 위에 마우스가 없습니다. 마우스는 소스를 우클릭 →
    "상호작용"으로 연 창에서만 동작합니다.
    그래서 이 위젯의 조작 버튼(이전/일시정지/다음)은 평소에는 완전히 투명하고
    (opacity:0, pointer-events:none) 자막 바 위에 마우스를 올렸을 때만 나타납니다.
    → 방송 화면에는 절대 안 보이고, "상호작용" 창에서 마우스를 올릴 때만 보입니다.

    · 조작 방법: 소스 우클릭 → "상호작용" → 자막 바 위에 마우스를 올리면
      왼쪽 위(위쪽 배치일 땐 왼쪽 아래)에 작은 버튼이 나타납니다.
      (이전 / 일시정지 / 다음 3개. ticker 모드에서는 일시정지 버튼 하나만 나옵니다.
       slide·fade 모드인데 문구가 하나뿐이면 넘길 것이 없으므로 버튼이 아예 나오지 않습니다.)
    · 키보드 단축키 ("상호작용" 창이 포커스된 상태에서)
        ← : 이전 문구      → : 다음 문구      Space : 일시정지 / 재생
    · 일시정지 상태와 현재 문구 번호는 자동 저장(localStorage)되어
      새로고침하거나 OBS를 다시 켜도 유지됩니다. 처음부터 시작하려면 ?reset=1 을 붙이세요.
  ─────────────────────────────────────────────────────────────
-->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}

  :root{
    --accent:#00ffa3;              /* 포인트 색 (JS가 덮어씀) */
    --accent-rgb:0,255,163;        /* 위 색의 r,g,b (글로우용) */
    --fs:34px;                     /* 기준 글자 크기 */
    --m:48px;                      /* 화면 가장자리 여백 */
    --bar:rgba(18,19,24,.92);      /* 바 배경 */
    --ink:#f4f6f8;                 /* 바 글자 색 */
    --chipink:#0e1116;             /* 칩 글자 색 (JS가 명암 보고 정함) */
    --radius:14px;                 /* 모서리 */
    --edge:rgba(255,255,255,.07);  /* 바 안쪽 1px 테두리 */
    --shadow:drop-shadow(0 10px 28px rgba(0,0,0,.38));
  }

  /* ── 테마 프리셋: 색·모서리·그림자만 다르고 레이아웃은 동일 ───── */
  body.theme-default{--bar:rgba(18,19,24,.92);--ink:#f4f6f8;--radius:14px;
    --edge:rgba(255,255,255,.07);--shadow:drop-shadow(0 10px 28px rgba(0,0,0,.38))}
  body.theme-default.light{--bar:rgba(252,253,255,.94);--ink:#15171c;
    --edge:rgba(0,0,0,.07);--shadow:drop-shadow(0 10px 26px rgba(20,24,40,.20))}

  body.theme-news{--bar:rgba(11,16,32,.95);--ink:#eef2ff;--radius:4px;
    --edge:rgba(255,255,255,.09);--shadow:drop-shadow(0 8px 22px rgba(0,0,0,.46))}
  body.theme-news.light{--bar:rgba(247,249,255,.96);--ink:#0b1020;
    --edge:rgba(11,16,32,.10);--shadow:drop-shadow(0 8px 20px rgba(11,16,32,.22))}

  body.theme-pastel{--bar:rgba(255,250,246,.96);--ink:#4a3a40;--radius:22px;
    --edge:rgba(120,80,95,.08);
    --shadow:drop-shadow(0 14px 34px rgba(var(--accent-rgb),.26)) drop-shadow(0 6px 16px rgba(70,45,55,.16))}
  body.theme-pastel:not(.light){--bar:rgba(48,35,43,.93);--ink:#fdf2f7;
    --edge:rgba(255,255,255,.08);
    --shadow:drop-shadow(0 14px 34px rgba(var(--accent-rgb),.22)) drop-shadow(0 8px 20px rgba(0,0,0,.34))}

  body.theme-minimal{--bar:rgba(255,255,255,.94);--ink:#1a1a1a;--radius:8px;
    --edge:rgba(0,0,0,.11);--shadow:drop-shadow(0 2px 8px rgba(0,0,0,.16))}
  body.theme-minimal:not(.light){--bar:rgba(24,24,26,.93);--ink:#fafafa;
    --edge:rgba(255,255,255,.10);--shadow:drop-shadow(0 3px 10px rgba(0,0,0,.42))}

  /* ── 위치(pos): #stage가 화면 기준 앵커, #wrap은 등장 애니메이션 담당 ── */
  #stage{position:fixed;max-width:calc(100vw - var(--m) * 2)}
  body.pos-bl #stage{left:var(--m);bottom:var(--m)}
  body.pos-br #stage{right:var(--m);bottom:var(--m)}
  body.pos-tl #stage{left:var(--m);top:var(--m)}
  body.pos-tr #stage{right:var(--m);top:var(--m)}
  body.pos-tc #stage{top:var(--m);left:50%;transform:translateX(-50%)}
  body.pos-bc #stage{bottom:var(--m);left:50%;transform:translateX(-50%)}
  body.pos-c  #stage{top:50%;left:50%;transform:translate(-50%,-50%)}

  #wrap{
    display:flex;align-items:stretch;
    filter:var(--shadow);
    animation:enter .6s cubic-bezier(.2,.8,.2,1) both;   /* 등장은 1회만 */
  }
  body.pos-tl #wrap,body.pos-tr #wrap,body.pos-tc #wrap{animation-name:enterTop}
  @keyframes enter{from{transform:translateY(26px);opacity:0}}
  @keyframes enterTop{from{transform:translateY(-26px);opacity:0}}

  /* 뉴스 테마 왼쪽 세로 액센트 바 */
  #vbar{display:none;width:6px;flex:0 0 6px;margin-right:6px;border-radius:2px;background:var(--accent)}
  body.theme-news #vbar{display:block;animation:vbarPulse 2.6s ease-in-out infinite}
  @keyframes vbarPulse{0%,100%{box-shadow:0 0 0 rgba(var(--accent-rgb),0)}
                       50%{box-shadow:0 0 16px rgba(var(--accent-rgb),.6)}}

  /* 왼쪽 칩(label) */
  #label{
    display:flex;align-items:center;max-width:34vw;
    padding:0 calc(var(--fs)*.5);background:var(--accent);color:var(--chipink);
    font-weight:800;font-size:calc(var(--fs)*.62);letter-spacing:.01em;
    border-radius:var(--radius) 0 0 var(--radius);
  }
  #labeltx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  body.theme-news #label{border-radius:var(--radius);animation:chipPulse 2.6s ease-in-out infinite}
  @keyframes chipPulse{
    0%,100%{filter:brightness(1);box-shadow:0 0 0 0 rgba(var(--accent-rgb),.30)}
    55%    {filter:brightness(1.14);box-shadow:0 0 0 7px rgba(var(--accent-rgb),0)}
  }
  body.nolabel #label{display:none}
  body.nolabel #bar{border-radius:var(--radius)}
  body.theme-news.nolabel #bar{margin-left:0}

  /* 자막 바 */
  #bar{
    display:flex;align-items:center;overflow:hidden;min-width:calc(var(--fs)*3);
    background:var(--bar);color:var(--ink);
    border-radius:0 var(--radius) var(--radius) 0;
    padding:0 calc(var(--fs)*.76);
    height:calc(var(--fs)*2.05);
    box-shadow:inset 0 0 0 1px var(--edge);
    transition:width .35s cubic-bezier(.2,.7,.2,1);
  }
  body.theme-news #bar{margin-left:6px;border-radius:var(--radius)}

  /* bar=0 — 바 배경 없이 글자만. 게임 화면 위에서 읽히도록 그림자를 강하게 */
  body.nobar #bar{
    background:transparent;box-shadow:none;
    text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.9);
  }
  body.nobar #vbar{display:none}
  body.nobar.light #bar{text-shadow:0 2px 10px rgba(255,255,255,.9),0 0 3px rgba(255,255,255,.95)}

  #txt{
    flex:1;min-width:0;
    font-size:var(--fs);font-weight:700;letter-spacing:-.01em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
    transition:transform .42s cubic-bezier(.2,.7,.2,1),opacity .42s ease;
  }
  #txt.out{transform:translateY(-130%);opacity:0}
  #txt.in{transition:none;transform:translateY(130%);opacity:0}
  /* ←(이전 문구)로 넘길 땐 반대 방향으로 밀어야 "되돌아간다"는 느낌이 난다 */
  body.back #txt.out{transform:translateY(130%)}
  body.back #txt.in{transform:translateY(-130%)}
  /* fade 모드는 방향 없이 투명도만 (아래 규칙이 위 .back 규칙을 덮어써야 하므로 순서 유지) */
  body.mode-fade #txt.out{transform:none}
  body.mode-fade #txt.in{transform:none}

  /* ticker(흐르는 자막) 모드 */
  #track{display:none;flex:0 0 auto;will-change:transform}
  body.mode-ticker #txt{display:none}
  body.mode-ticker #track{display:inline-flex}
  body.mode-ticker #stage{left:var(--m);right:var(--m);transform:none;max-width:none}
  body.mode-ticker.pos-c #stage{transform:translateY(-50%)}
  body.mode-ticker #wrap{width:100%}
  body.mode-ticker #bar{flex:1;min-width:0}
  .half{display:inline-flex;align-items:center;gap:calc(var(--fs)*1.2);
        padding-right:calc(var(--fs)*1.2);
        font-size:var(--fs);font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .half .sep{color:var(--accent);opacity:.92;font-weight:900}
  @keyframes tick{from{transform:translateX(0)} to{transform:translateX(-50%)}}

  /* 폭 계산용 (화면 밖) */
  #measure{position:absolute;left:-9999px;top:-9999px;visibility:hidden;
           font-size:var(--fs);font-weight:700;letter-spacing:-.01em;white-space:nowrap}

  /* ── 조작 버튼: 평소엔 완전히 투명 + 클릭 불가.
        OBS "상호작용" 창에서 마우스를 올렸을 때만 나타난다. ───────── */
  #ctrl{
    position:absolute;left:0;top:-42px;height:42px;
    display:flex;align-items:flex-start;gap:6px;
    /* 아래쪽 14px 패딩은 "다리" 역할: 버튼과 자막 바 사이가 떨어져 있으면
       마우스를 올리는 도중 hover가 풀려 버튼을 누를 수 없게 된다. */
    padding-bottom:14px;
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  #wrap:hover #ctrl{opacity:1;pointer-events:auto}
  body.pos-tl #ctrl,body.pos-tr #ctrl,body.pos-tc #ctrl{
    top:auto;bottom:-42px;align-items:flex-end;padding-bottom:0;padding-top:14px}
  body.noctrl #ctrl{display:none}
  body.mode-ticker #btn-prev,body.mode-ticker #btn-next{display:none}  /* 티커엔 이전/다음이 없다 */
  #ctrl button{
    width:32px;height:28px;display:flex;align-items:center;justify-content:center;
    padding:0;cursor:pointer;border-radius:7px;
    border:1px solid rgba(255,255,255,.18);background:rgba(12,14,18,.72);
  }
  #ctrl button:hover{background:rgba(12,14,18,.92)}
  #ctrl svg{width:15px;height:15px;fill:#fff;display:block}
  body.light #ctrl button{border-color:rgba(0,0,0,.14);background:rgba(255,255,255,.9)}
  body.light #ctrl button:hover{background:#fff}
  body.light #ctrl svg{fill:#1a1a1a}
  /* 주의: 위 "#ctrl svg" 규칙은 id+타입이라 "#ico-play"(id 하나)보다 우선순위가 높다.
     아래를 그냥 #ico-play 로 쓰면 display:block 이 이겨서
     재생·일시정지 아이콘이 한 버튼 안에 동시에 보인다. 그래서 id를 두 개 겹쳐 쓴다. */
  #ctrl #ico-play{display:none}
  body.paused #ctrl #ico-play{display:block}
  body.paused #ctrl #ico-pause{display:none}

  /* ── 크레딧 (온에어킷 공통) ───────────────────────────────── */
  #wrap{position:relative}
  #credit{position:absolute;right:2px;bottom:-17px;font-size:11px;font-weight:600;
    letter-spacing:.06em;color:rgba(255,255,255,.34);
    text-shadow:0 1px 3px rgba(0,0,0,.55);pointer-events:none;user-select:none;white-space:nowrap}
  body.light #credit{color:rgba(0,0,0,.30);text-shadow:none}
  body.nocredit #credit{display:none}
  /* 위쪽 배치일 땐 크레딧이 화면 밖으로 잘리므로 아래로 뒤집는다 */
  body.pos-tl #credit,body.pos-tr #credit,body.pos-tc #credit{bottom:auto;top:calc(100% + 4px)}

  @media (prefers-reduced-motion: reduce){
    #wrap{animation:none}
    /* 위쪽 배치용 animation-name 규칙이 위 한 줄보다 우선순위가 높아서
       따로 꺼 주지 않으면 등장 애니메이션이 되살아난다 */
    body.pos-tl #wrap,body.pos-tr #wrap,body.pos-tc #wrap{animation:none}
    #txt{transition:none}
    #bar{transition:none}
    #ctrl{transition:none}
    /* 속보 펄스 제거 */
    body.theme-news #label,body.theme-news #vbar{animation:none}
    /* ticker는 흐르는 것 자체가 기능이라 유지합니다 */
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="wrap">
      <div id="vbar"></div>
      <div id="label"><span id="labeltx"></span></div>
      <div id="bar">
        <div id="txt"></div>
        <div id="track"></div>
      </div>

      <div id="ctrl">
        <button id="btn-prev" type="button" title="이전 문구 (←)" aria-label="이전 문구">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5.6v12.8L8.2 12z"/><rect x="5.2" y="5.6" width="2.2" height="12.8" rx="1.1"/></svg>
        </button>
        <button id="btn-play" type="button" title="일시정지 / 재생 (Space)" aria-label="일시정지 또는 재생">
          <svg id="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5.5" width="3.6" height="13" rx="1.3"/><rect x="13.4" y="5.5" width="3.6" height="13" rx="1.3"/></svg>
          <svg id="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13L18.6 12z"/></svg>
        </button>
        <button id="btn-next" type="button" title="다음 문구 (→)" aria-label="다음 문구">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.6v12.8L15.8 12z"/><rect x="16.6" y="5.6" width="2.2" height="12.8" rx="1.1"/></svg>
        </button>
      </div>

      <div id="credit">온에어킷</div>
    </div>
  </div>
  <span id="measure"></span>

<script>
/* ── 기본값: 메모장으로 열어 여기만 고쳐도 됩니다 ─────────────── */
const CONFIG = {
  /* 주의: 이 문자열은 세로줄(|)로 잘려 여러 문구가 됩니다.
     그래서 문구 안에 세로줄 기호를 "글자로" 넣으면 그 자리에서 잘려 버립니다. */
  text: "온에어킷 텔롭 위젯 — URL 뒤에 ?text=원하는 문구 를 붙여보세요|여러 문장은 세로줄 기호로 구분하면 순서대로 돌아갑니다|테마는 ?theme=news / pastel / minimal",
  label: "공지",        // 비우면("") 칩 숨김
  accent: "",           // 비우면 테마 기본 액센트 사용. 예: "#ffd166"
  mode: "slide",        // slide | fade | ticker
  interval: 6,          // 전환 간격(초, 2~60)
  size: 34,             // 글자 크기(px, 16~120)
  dark: "",            // 빈 값이면 테마 기본값 / 1=어두운 바 / 0=밝은 바
  bar: 1,               // 1=자막 바 배경 표시 / 0=배경 없이 글자만(그림자 부착)
  speed: 120,           // ticker 속도(px/초, 40~400)
  theme: "default",     // default | news | pastel | minimal
  pos: "bl",            // bl | br | tl | tr | tc | bc | c
  margin: 48,           // 화면 가장자리 여백(px, 0~400)
  credit: 1             // 1=표시 / 0=숨김 / 그 외 문자열이면 그 문구로 교체
};
/* ─────────────────────────────────────────────────────────── */

/* ── 공통 도우미 ─────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const pick = (k, def) => { const v = q.get(k); return (v === null || v === "") ? String(def) : v; };
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const num = (v, def) => { const n = parseFloat(v); return Number.isFinite(n) ? n : def; };
const oneOf = (v, list, def) => list.indexOf(String(v)) >= 0 ? String(v) : def;

/* 색 검증: 3자리/6자리 hex만 통과. 실패하면 대체값 */
const HEX_RE = /^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
function normHex(v, fallback){
  const s = String(v == null ? "" : v).trim();
  if (!HEX_RE.test(s)) return fallback;
  let h = s.replace(/^#/, "").toLowerCase();
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return "#" + h;
}
function hexToRgb(h){
  const x = h.replace(/^#/, "");
  return [parseInt(x.slice(0,2),16), parseInt(x.slice(2,4),16), parseInt(x.slice(4,6),16)];
}

/* ── 테마 프리셋: dark/accent의 "기본값"만 정한다 ──────────── */
const THEMES = {
  "default": { dark:true,  accent:{ dark:"#00ffa3", light:"#00c07a" } },
  "news":    { dark:true,  accent:{ dark:"#ff2d55", light:"#e51843" } },
  "pastel":  { dark:false, accent:{ dark:"#ff8fb1", light:"#ff8fb1" } },
  "minimal": { dark:false, accent:{ dark:"#ededed", light:"#1a1a1a" } }
};

/* 모션 최소화(prefers-reduced-motion) 설정 여부.
   이 설정에서는 CSS가 #txt의 transition을 없애므로, 전환 대기 시간까지 0으로 만들지 않으면
   글자가 사라진 채 빈 바가 0.4초 넘게 보인다. */
let REDUCE = false;
try { REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { REDUCE = false; }

/* 전환 애니메이션 길이(ms). interval 최소값은 이 값보다 반드시 커야 한다 */
const TRANS_MS = REDUCE ? 0 : 430;
const MIN_INTERVAL = Math.max(2, (TRANS_MS * 2) / 1000);   /* 초 */
const MAX_INTERVAL = 60;

/* ── 파라미터 계산 (URL이 CONFIG를 덮어씀) ───────────────── */
const theme = oneOf(pick("theme", CONFIG.theme), ["default","news","pastel","minimal"], "default");
const preset = THEMES[theme];

const darkRaw = pick("dark", CONFIG.dark);
const isDark = darkRaw === "0" ? false : darkRaw === "1" ? true : preset.dark;

const cfg = {
  theme:    theme,
  text:     pick("text", CONFIG.text),
  label:    q.has("label") ? q.get("label") : String(CONFIG.label),
  accent:   normHex(pick("accent", CONFIG.accent), preset.accent[isDark ? "dark" : "light"]),
  mode:     oneOf(pick("mode", CONFIG.mode), ["slide","fade","ticker"], "slide"),
  interval: clamp(num(pick("interval", CONFIG.interval), 6), MIN_INTERVAL, MAX_INTERVAL),
  size:     Math.round(clamp(num(pick("size", CONFIG.size), 34), 16, 120)),
  dark:     isDark,
  bar:      oneOf(pick("bar", CONFIG.bar), ["1","0"], "1"),
  speed:    clamp(num(pick("speed", CONFIG.speed), 120), 40, 400),
  pos:      oneOf(pick("pos", CONFIG.pos), ["bl","br","tl","tr","tc","bc","c"], "bl"),
  margin:   Math.round(clamp(num(pick("margin", CONFIG.margin), 48), 0, 400))
};

/* ── 화면에 반영 ────────────────────────────────────────── */
const rgb = hexToRgb(cfg.accent);
/* 칩 배경이 액센트색이므로, 밝기를 보고 칩 글자색을 자동으로 고른다 */
const luma = (0.2126*rgb[0] + 0.7152*rgb[1] + 0.0722*rgb[2]) / 255;
const root = document.documentElement.style;
root.setProperty("--accent", cfg.accent);
root.setProperty("--accent-rgb", rgb[0] + "," + rgb[1] + "," + rgb[2]);
root.setProperty("--chipink", luma > 0.62 ? "#0e1116" : "#ffffff");
root.setProperty("--fs", cfg.size + "px");
root.setProperty("--m", cfg.margin + "px");

document.body.classList.add("theme-" + cfg.theme, "pos-" + cfg.pos, "mode-" + cfg.mode);
if (!cfg.dark) document.body.classList.add("light");
if (cfg.bar === "0") document.body.classList.add("nobar");

/* 사용자 입력은 항상 textContent로만 넣는다 (XSS 방지) */
const labelText = String(cfg.label).trim();
if (labelText) $("labeltx").textContent = labelText;
else document.body.classList.add("nolabel");

const texts = String(cfg.text).split("|").map(t => t.trim()).filter(Boolean);
if (!texts.length) texts.push("온에어킷 텔롭 위젯");

/* 크레딧 (온에어킷 공통 코드) */
const creditRaw = q.has("credit") ? q.get("credit") : String(CONFIG.credit);
if (creditRaw === "0") document.body.classList.add("nocredit");
else document.getElementById("credit").textContent =
  (creditRaw === "1" || creditRaw === "") ? "온에어킷" : creditRaw;

/* 폰트 로딩 완료 시점 (실패해도 진행) */
let fontsReady;
try { fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve(); }
catch (e) { fontsReady = Promise.resolve(); }

/* ── 상태 저장 (OBS 재시작해도 유지, ?reset=1 이면 무시) ──── */
const LS_KEY = "onairkit:telop:";
const noStore = q.get("reset") === "1";
function load(k, def){
  if (noStore) return def;
  try { const v = localStorage.getItem(LS_KEY + k); return v === null ? def : v; } catch (e) { return def; }
}
function save(k, v){
  if (noStore) return;
  try { localStorage.setItem(LS_KEY + k, String(v)); } catch (e) { /* file://에서 막혀도 무시 */ }
}

let paused = load("paused", "0") === "1";
if (paused) document.body.classList.add("paused");

/* ── 공통 요소 ──────────────────────────────────────────── */
const bar = $("bar"), txt = $("txt"), track = $("track");
let idx = clamp(Math.round(num(load("index", 0), 0)), 0, texts.length - 1);
let switching = false;      /* 전환 중 재진입 방지 플래그 */
let lastAt = Date.now();    /* 마지막 전환 시각 (Date 기준, 누적 계산 금지) */

/* ── ticker(흐르는 자막) ────────────────────────────────── */
let halfA = null, tickerDur = 0;

/* 문구 한 벌(모든 문구 + 구분점)을 만들어 붙인다 */
function fillUnit(host){
  for (let n = 0; n < texts.length; n++){
    const s = document.createElement("span"); s.textContent = texts[n]; host.appendChild(s);
    const d = document.createElement("span"); d.className = "sep"; d.textContent = "·"; host.appendChild(d);
  }
}
/* 바 폭보다 넓어질 때까지 문구를 반복해 채우고, 같은 것을 하나 더 복제해 이어 붙인다.
   -50% 만큼 흐르면 정확히 같은 그림이 되므로 끊김이 없다. */
function buildTicker(){
  track.style.animation = "none";
  track.textContent = "";
  halfA = document.createElement("span");
  halfA.className = "half";
  track.appendChild(halfA);
  const barW = Math.max(120, bar.clientWidth);
  let guard = 0;
  do { fillUnit(halfA); guard++; } while (halfA.offsetWidth < barW && guard < 40);
  track.appendChild(halfA.cloneNode(true));
  tickerDur = 0;
  tuneTicker(true);
}
/* 폭이 바뀌었을 수 있으니 흐름 시간을 다시 계산한다 (resize / 폰트 로드 후 호출) */
function tuneTicker(force){
  if (!halfA) return;
  const halfW = Math.max(1, halfA.offsetWidth);
  const dur = Math.max(2, halfW / cfg.speed);
  if (force || Math.abs(dur - tickerDur) > 0.01){
    tickerDur = dur;
    if (force){
      void track.offsetWidth;   /* 리플로우: 애니메이션을 확실히 새로 시작 */
      track.style.animation = "tick " + dur.toFixed(2) + "s linear infinite";
    } else {
      track.style.animationDuration = dur.toFixed(2) + "s";
    }
  }
  track.style.animationPlayState = paused ? "paused" : "running";
}

/* ── slide / fade ───────────────────────────────────────── */
function barPadX(){
  try {
    const cs = getComputedStyle(bar);
    return (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  } catch (e) { return cfg.size * 1.52; }
}
/* 바를 뺀 나머지(세로 액센트 바 + 칩 + 사이 여백)의 폭 */
function sideW(){
  const wrapW = $("wrap").getBoundingClientRect().width;
  const barW = bar.getBoundingClientRect().width;
  return Math.max(0, wrapW - barW);
}
function setTo(t){
  const measure = $("measure");
  measure.textContent = t;
  const maxW = window.innerWidth - cfg.margin * 2 - sideW();
  const w = Math.min(measure.offsetWidth + barPadX() + 2, Math.max(160, maxW));
  bar.style.width = Math.round(w) + "px";
  txt.textContent = t;
}
function go(dir){
  if (switching || texts.length < 2) return;
  switching = true;                    /* 전환이 끝나기 전엔 다음 전환이 못 들어온다 */
  document.body.classList.toggle("back", dir < 0);   /* 이전 문구면 반대 방향으로 */
  txt.classList.add("out");
  setTimeout(() => {
    idx = (idx + dir + texts.length) % texts.length;
    save("index", idx);
    setTo(texts[idx]);
    txt.classList.add("in");
    txt.classList.remove("out");
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      txt.classList.remove("in");
      switching = false;
      lastAt = Date.now();
    };
    /* 백그라운드 탭에서는 rAF가 멈추므로 setTimeout으로도 반드시 풀어 준다 */
    requestAnimationFrame(() => requestAnimationFrame(finish));
    setTimeout(finish, 90);
  }, TRANS_MS);
}

/* ── 조작(이전 / 일시정지 / 다음) ───────────────────────── */
function setPaused(v){
  paused = !!v;
  document.body.classList.toggle("paused", paused);
  save("paused", paused ? 1 : 0);
  if (cfg.mode === "ticker" && halfA) track.style.animationPlayState = paused ? "paused" : "running";
  if (!paused) lastAt = Date.now();
}
function manual(dir){
  if (cfg.mode === "ticker") return;
  go(dir);
  lastAt = Date.now();
}
$("btn-prev").addEventListener("click", () => manual(-1));
$("btn-next").addEventListener("click", () => manual(1));
$("btn-play").addEventListener("click", () => setPaused(!paused));
window.addEventListener("keydown", e => {
  /* Ctrl/Alt/Cmd 조합(새로고침·뒤로가기 등)은 가로채지 않는다 — 5종 공통 처리 */
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "ArrowLeft"){ e.preventDefault(); manual(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); manual(1); }
  else if (e.key === " " || e.code === "Space"){ e.preventDefault(); setPaused(!paused); }
});
/* 조작할 것이 없으면 버튼 자체를 숨긴다 */
if (cfg.mode !== "ticker" && texts.length < 2) document.body.classList.add("noctrl");

/* ── 실행 ───────────────────────────────────────────────── */
if (cfg.mode === "ticker"){
  buildTicker();
  fontsReady.then(() => requestAnimationFrame(() => { buildTicker(); }));
} else {
  setTo(texts[idx]);
  fontsReady.then(() => setTo(texts[idx]));

  /* 시간은 항상 Date 기준으로 비교한다 (탭이 백그라운드로 가도 어긋나지 않음) */
  if (texts.length > 1){
    setInterval(() => {
      if (paused || switching) return;
      if (Date.now() - lastAt < cfg.interval * 1000) return;
      lastAt = Date.now();
      go(1);
    }, 120);
  }
}

/* ── 창 크기 변경 대응 (흐름 시간·바 폭 재계산) ─────────── */
let resizeTimer = 0;
function relayout(){
  if (cfg.mode === "ticker"){
    const barW = Math.max(120, bar.clientWidth);
    /* 창이 넓어져 반복 횟수가 모자라면 다시 만들고, 아니면 흐름 시간만 다시 계산한다 */
    if (!halfA || halfA.offsetWidth < barW) buildTicker();
    else tuneTicker(false);
  } else {
    setTo(texts[idx]);
  }
}
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(relayout, 140);
});
fontsReady.then(() => setTimeout(relayout, 60));
</script>
</body>
</html>
